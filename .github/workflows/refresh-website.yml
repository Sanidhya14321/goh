name: Refresh GoHarness website

on:
  workflow_call:
    secrets:
      GOH_WEBSITE_REFRESH_TOKEN:
        required: false
  release:
    types: [published, edited, unpublished, deleted]

permissions: {}

jobs:
  dispatch:
    if: ${{ vars.GOH_WEBSITE_REPO != '' && (github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the website Pages workflow
        env:
          GH_TOKEN: ${{ secrets.GOH_WEBSITE_REFRESH_TOKEN }}
          WEBSITE_REPO: ${{ vars.GOH_WEBSITE_REPO }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            printf '%s\n' 'Configure GOH_WEBSITE_REFRESH_TOKEN with Actions: write on the website repository.' >&2
            exit 1
          fi
          gh workflow run pages.yml --repo "$WEBSITE_REPO"
