name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          # Linux and macOS runners must exercise the real shell sandbox.
          GOH_REQUIRE_SANDBOX: ${{ runner.os == 'Windows' && '0' || '1' }}
      - name: Build and smoke-run the binary
        run: |
          go build -o goh${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/harness
          ./goh${{ runner.os == 'Windows' && '.exe' || '' }} version
  vulncheck:
    # Known vulnerabilities in reachable code of the pinned module graph and
    # the Go standard library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  terminal:
    # The compiled binary in real pseudo-terminals, plus CLI, setup and ACP
    # scenarios, against the scripted local model (no credentials).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make build GO=go
      - run: make acceptance GO=go
      - run: python3 scripts/e2e/test_tui.py
      - run: python3 scripts/e2e/test_setup.py
      - run: python3 scripts/e2e/test_acp.py
      - run: python3 scripts/e2e/test_attach.py
      - run: python3 scripts/e2e/test_resume_setup.py
      - run: python3 scripts/e2e/test_salvage.py
  attach-race:
    # The attached chat with a race-instrumented goh, against the scripted
    # local model: fails on a nonzero attached or server exit, or on any
    # race report.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Race-instrumented attach
        shell: bash
        run: |
          set -eu
          dir=$(mktemp -d)
          mkdir -p "$dir/bin" "$dir/scripts/e2e"
          go build -race -o "$dir/bin/goh" ./cmd/harness
          go build -o "$dir/bin/scripted-model" ./cmd/scripted-model
          cp scripts/e2e/test_attach.py scripts/e2e/vtscreen.py "$dir/scripts/e2e/"
          GORACE="log_path=$dir/race exitcode=99" python3 "$dir/scripts/e2e/test_attach.py"
          if ls "$dir"/race.* >/dev/null 2>&1; then cat "$dir"/race.*; exit 1; fi
  bench-smoke:
    # Offline benchmark gate: the grader validates two native tasks (with
    # their recorded test identities) without a model, Docker or network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Native dry run
        run: |
          go build -o "$RUNNER_TEMP/goh-bench" ./cmd/bench
          "$RUNNER_TEMP/goh-bench" --tasks bench/tasks --only go-counter-race,py-cart-discount --dry-run
  install:
    # One-command installers against a local release-layout server, natively.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: make release GO=go VERSION=ci-${{ github.sha }} && sh scripts/test_install.sh
      - name: Homebrew formula
        if: runner.os == 'macOS'
        shell: bash
        run: sh scripts/test_brew.sh ci-${{ github.sha }}
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $out | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-X main.version=ci-${{ github.sha }}" -o "$out\goh-windows-amd64.exe" ./cmd/harness
          $hash = (Get-FileHash -Algorithm SHA256 "$out\goh-windows-amd64.exe").Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path "$out\SHA256SUMS" -Value "$hash  goh-windows-amd64.exe`n"
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$out -PassThru
          # Wait until the local download server answers (up to 30 s).
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            try { Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/' -TimeoutSec 2 | Out-Null; $ready = $true } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw 'download server did not start' }
          try {
            $env:GOH_BASE_URL = 'http://127.0.0.1:8765'
            $env:GOH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'goh-bin'
            ./scripts/install.ps1
            $v = & (Join-Path $env:GOH_INSTALL_DIR 'goh.exe') version
            if ($v -ne "ci-${{ github.sha }}") { throw "installed version $v" }
            Write-Host "PASS clean install: $v"
            Add-Content -Path "$out\goh-windows-amd64.exe" -Value 'tampered'
            $env:GOH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'goh-bin2'
            $refused = $false
            try { ./scripts/install.ps1 } catch { $refused = "$_" -match 'checksum mismatch' }
            if (-not $refused) { throw 'tampered binary was not refused' }
            if (Test-Path (Join-Path $env:GOH_INSTALL_DIR 'goh.exe')) { throw 'tampered binary left on disk' }
            Write-Host 'PASS tampered download refused'
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - name: Scoop manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "ci-${{ github.sha }}"
          bash -c "GO=go VERSION=$version sh scripts/release.sh && sh scripts/packaging.sh $version dist http://127.0.0.1:8766"
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
          $server = Start-Process python -ArgumentList '-m','http.server','8766','--bind','127.0.0.1','--directory','dist' -PassThru
          try {
            Invoke-RestMethod -Uri https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
            & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
            $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
            scoop install .\dist\goh.json
            if ($LASTEXITCODE -ne 0) { throw 'scoop install failed' }
            $v = goh version
            if ($v -ne $version) { throw "installed version $v" }
            Write-Host "PASS scoop install: $v"
            $upgrade = goh upgrade 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0 -or $upgrade -notmatch 'scoop update goh') { throw "goh upgrade did not defer to scoop: $upgrade" }
            Write-Host 'PASS goh upgrade defers to scoop'
            $global:LASTEXITCODE = 0  # goh upgrade's refusal above is the expected result
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
