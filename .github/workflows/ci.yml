name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          # Linux and macOS runners must exercise the real shell sandbox.
          GOH_REQUIRE_SANDBOX: ${{ runner.os == 'Windows' && '0' || '1' }}
      - name: Build and smoke-run the binary
        run: |
          go build -o goh${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/harness
          ./goh${{ runner.os == 'Windows' && '.exe' || '' }} version
  terminal:
    # The compiled binary in real pseudo-terminals, plus CLI, setup and ACP
    # scenarios, against the scripted local model (no credentials).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make build GO=go
      - run: make acceptance GO=go
      # The PTY suite matches raw output bytes; when the renderer redraws only
      # the changed cells of a line, a needle can be split by cursor moves.
      # One retry absorbs that until the suite checks an emulated screen.
      - run: python3 scripts/test_tui.py || python3 scripts/test_tui.py
      - run: python3 scripts/test_setup.py
      - run: python3 scripts/test_acp.py
  install:
    # One-command installers against a local release-layout server, natively.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: make release GO=go VERSION=ci-${{ github.sha }} && sh scripts/test_install.sh
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $out | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-X main.version=ci-${{ github.sha }}" -o "$out\goh-windows-amd64.exe" ./cmd/harness
          $hash = (Get-FileHash -Algorithm SHA256 "$out\goh-windows-amd64.exe").Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path "$out\SHA256SUMS" -Value "$hash  goh-windows-amd64.exe`n"
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$out -PassThru
          # Wait until the local download server answers (up to 30 s).
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            try { Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/' -TimeoutSec 2 | Out-Null; $ready = $true } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw 'download server did not start' }
          try {
            $env:GOH_BASE_URL = 'http://127.0.0.1:8765'
            $env:GOH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'goh-bin'
            ./scripts/install.ps1
            $v = & (Join-Path $env:GOH_INSTALL_DIR 'goh.exe') version
            if ($v -ne "ci-${{ github.sha }}") { throw "installed version $v" }
            Write-Host "PASS clean install: $v"
            Add-Content -Path "$out\goh-windows-amd64.exe" -Value 'tampered'
            $env:GOH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'goh-bin2'
            $refused = $false
            try { ./scripts/install.ps1 } catch { $refused = "$_" -match 'checksum mismatch' }
            if (-not $refused) { throw 'tampered binary was not refused' }
            if (Test-Path (Join-Path $env:GOH_INSTALL_DIR 'goh.exe')) { throw 'tampered binary left on disk' }
            Write-Host 'PASS tampered download refused'
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
